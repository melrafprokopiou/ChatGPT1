<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatGPT Infinity</title>
    <script src="https://puter.com"></script>
    <script src="https://tailwindcss.com"></script>
    <style>
        :root { --chat-bg: #000000; --panel-bg: #171717; --accent: #10a37f; }
        body { background-color: var(--chat-bg); color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .glass { background: rgba(23, 23, 23, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .plus-btn { background: #2f2f2f; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; color: #d1d1d1; transition: 0.2s; }
        .plus-btn:active { transform: scale(0.95); background: #3f3f3f; }
        .nav-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.2s; }
        .nav-icon:active { background: rgba(255,255,255,0.1); }
        .card-carousel { display: flex; gap: 16px; overflow-x: auto; padding: 20px 50px; scroll-snap-type: x mandatory; }
        .card-carousel::-webkit-scrollbar { display: none; }
        .card { width: 160px; height: 160px; border-radius: 24px; flex-shrink: 0; scroll-snap-align: center; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,0.1); }
        .bottom-bar { background: var(--panel-bg); border-radius: 35px; height: 60px; margin: 0 20px 20px; padding: 0 16px; border: 1px solid #262626; position: fixed; bottom: env(safe-area-inset-bottom); left: 0; right: 0; }
        .voice-btn { width: 36px; height: 36px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .try-btn { border: 1.5px solid #333; border-radius: 25px; padding: 10px 28px; font-size: 15px; font-weight: bold; margin-top: 24px; transition: 0.2s; }
        .try-btn:active { background: #fff; color: #000; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Top Navigation -->
    <header class="flex items-center justify-between p-4 pt-8">
        <div class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></div>
        <div class="plus-btn flex items-center gap-1.5"><span class="text-purple-400">✦</span> Get Plus</div>
        <div class="flex gap-1">
            <div class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg></div>
            <div class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        </div>
    </header>

    <!-- Center Interactive Area -->
    <div class="flex-1 flex flex-col items-center justify-center -mt-12">
        <div class="card-carousel no-scrollbar">
            <div class="card opacity-40 grayscale" style="background-image: url('https://picsum.photos')"></div>
            <div class="card border-2 border-orange-500 scale-110 shadow-[0_0_40px_rgba(255,165,0,0.2)]" style="background-image: url('https://placecats.com')"></div>
            <div class="card opacity-40 grayscale" style="background-image: url('https://picsum.photos')"></div>
        </div>
        
        <div class="text-center px-14 mt-10">
            <h2 class="text-2xl font-bold tracking-tight">The next era of<br>image creation</h2>
            <p class="text-[#8e8e8e] text-[15px] mt-4 leading-relaxed font-medium">More magic, more control — create stunning visuals with professional precision.</p>
            <button class="try-btn">Try it</button>
        </div>
    </div>

    <!-- The 100% Original Bottom Bar -->
    <div class="bottom-bar flex items-center gap-4">
        <div class="text-[#8e8e8e] text-3xl font-light">+</div>
        <input id="userInput" type="text" autocomplete="off" class="flex-1 bg-transparent border-none outline-none text-white text-[17px] placeholder-[#8e8e8e]" placeholder="Ask ChatGPT">
        <div class="flex items-center gap-5">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
            <div class="voice-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><path d="M12 2v20M17 5v14M7 5v14M2 10v4M22 10v4"/></svg>
            </div>
        </div>
    </div>

    <script>
        async function askAI() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if(!val) return;
            
            const originalPlaceholder = input.placeholder;
            input.value = "";
            input.placeholder = "Σκέφτομαι...";
            
            try {
                const res = await puter.ai.chat("Απάντησε στα Ελληνικά σαν ιδιοφυΐα: " + val);
                alert("ChatGPT: " + res.message.content);
                
                const speech = new SpeechSynthesisUtterance(res.message.content);
                speech.lang = 'el-GR';
                window.speechSynthesis.speak(speech);
            } catch (e) {
                alert("Σφάλμα σύνδεσης. Δοκίμασε ξανά.");
            } finally {
                input.placeholder = originalPlaceholder;
            }
        }
        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') askAI(); });
    </script>
</body>
</html>
